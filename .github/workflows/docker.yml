name: Publish container
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate release version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "${version}" = "1.0.0"
          test "${GITHUB_REF_NAME}" = "v1.0"
          echo "VERSION=1.0" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: zongpu:smoke
      - name: Verify empty container and restart
        shell: bash
        run: |
          docker volume create zongpu-smoke
          docker volume create zongpu-smoke-backups
          docker run -d --name zongpu-smoke --read-only --tmpfs /tmp -p 127.0.0.1:39210:3000 -v zongpu-smoke:/app/data -v zongpu-smoke-backups:/app/backups zongpu:smoke
          trap 'docker logs zongpu-smoke; docker rm -f zongpu-smoke; docker volume rm zongpu-smoke zongpu-smoke-backups' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:39210/api/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:39210/api/health
          docker exec zongpu-smoke node --input-type=module -e '
            import { DatabaseSync } from "node:sqlite";
            import assert from "node:assert/strict";
            const db = new DatabaseSync("/app/data/zongpu.sqlite", {readOnly:true});
            assert.equal(db.prepare("PRAGMA integrity_check").get().integrity_check, "ok");
            for (const t of ["people", "relations", "attachments", "sessions", "invites", "shares", "import_previews"]) assert.equal(db.prepare(`SELECT count(*) AS n FROM ${t}`).get().n, 0);
            assert.equal(db.prepare("SELECT count(*) AS n FROM users").get().n, 1);
            assert.equal(db.prepare("SELECT username FROM users").get().username, "admin");
            db.close();'
          docker restart zongpu-smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:39210/api/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:39210/api/health
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=1.0
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=宗谱
            org.opencontainers.image.licenses=MIT
      - name: Publish both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
